# CKAD concepts, module playgrounds and guided practice; YAML checks are indexed separately.
training:
  id: ATS027
  title: 'CKAD: Application Design and Build'
  description: Detailed CKAD teaching with module playgrounds, guided hands-on practice and reusable YAML
    knowledge checks. Technical content remains draft for review.
  certification:
    name: Certified Kubernetes Application Developer
    code: CKAD
    provider: CNCF / Linux Foundation
    domain: Application Design and Build
    weight: 20
    competencies:
    - Define, build and modify container images
    - Choose and use the right workload resource (Deployment, DaemonSet, CronJob, etc.)
    - Understand multi-container Pod design patterns (e.g. sidecar, init and others)
    - Utilize persistent and ephemeral volumes
