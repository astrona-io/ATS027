version: 1
approval: CKAD playgrounds and guided practice requested 2026-10-12; no new graded labs.
course:
  id: ATS027
  certification:
    name: Certified Kubernetes Application Developer
    code: CKAD
    provider: CNCF / Linux Foundation
    domain: Application Design and Build
    weight: 20
    competencies:
    - Define, build and modify container images
    - Choose and use the right workload resource (Deployment, DaemonSet, CronJob, etc.)
    - Understand multi-container Pod design patterns (e.g. sidecar, init and others)
    - Utilize persistent and ephemeral volumes
defaults:
  playground: true
  module_lab: false
  capstone: false
  section_quiz: true
  final_quiz: true
assessment_format: YAML question banks, schema version 1; indexed in assessments/index.yaml
