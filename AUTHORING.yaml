  curriculum_item: Define, build and modify container images
  capstone: false
  section_quiz: true
  modules:
  - id: module-01
    title: Image Identity And Distribution
    objectives:
    - Explain image layers and immutable digests.
    - Distinguish tags from exact image identity.
    - Trace image retrieval and registry authentication.
    - Diagnose image selection and pull failures.
    outline:
    - Layers, Tags And Digests
    - From Build To Image Pull
    - Inspect Image References And Running Content Identity
    playground: true
    module_lab: false
