apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-scout
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-scout
  template:
    metadata:
      labels:
        app: legacy-scout
    spec:
      containers:
        - name: legacy
          image: docker.io/library/busybox:1.37.0
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                echo "time=$(date +%s)" >> /report/report.txt
                if reply="$(wget -q -T 2 -O - http://127.0.0.1:9000/ 2>/dev/null)"; then
                  echo "status=ok" >> /report/report.txt
                  echo "reply=$reply" >> /report/report.txt
                  echo "legacy: uplink ok"
                else
                  echo "status=error" >> /report/report.txt
                  echo "legacy: uplink failed"
                fi
                sleep 5
              done
          volumeMounts:
            - name: report
              mountPath: /report
        - name: ambassador
          image: docker.io/library/python:3.13-alpine
          command: ["python", "/code/proxy.py"]
          volumeMounts:
            - name: code
              mountPath: /code
              readOnly: true
            - name: uplink
              mountPath: /etc/ambassador
              readOnly: true
        - name: adapter
          image: docker.io/library/busybox:1.37.0
          command: ["sh", "-c"]
          args:
            - |
              trap 'exit 0' TERM
              tail -n +1 -F /report/report.txt | while IFS= read -r line; do
                echo "$line" | sed 's/^\([^=]*\)=\(.*\)$/{"\1":"\2"}/'
              done &
              wait $!
          volumeMounts:
            - name: report
              mountPath: /report
              readOnly: true
      volumes:
        - name: report
          emptyDir: {}
        - name: code
          configMap:
            name: ambassador-code
        - name: uplink
          configMap:
            name: uplink-config
