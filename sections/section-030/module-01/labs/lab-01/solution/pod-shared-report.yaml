apiVersion: v1
kind: Pod
metadata:
  name: shared-report
  namespace: starfleet
spec:
  restartPolicy: Never
  containers:
  - name: reader
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - test "$(cat /shared/message)" = initialized; sleep 3600
    volumeMounts:
    - name: shared
      mountPath: /shared
      readOnly: true
  - name: observer
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - sleep 3600
    volumeMounts:
    - name: shared
      mountPath: /shared
      readOnly: true
  initContainers:
  - name: prepare
    image: docker.io/library/busybox:1.37.0
    command:
    - sh
    - -c
    - printf initialized > /shared/message
    volumeMounts:
    - name: shared
      mountPath: /shared
  volumes:
  - name: shared
    emptyDir: {}
