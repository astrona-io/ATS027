apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: probe-page
  namespace: starfleet
data:
  index.html: "probe-nominal\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: probe
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: probe
  template:
    metadata:
      labels:
        app: probe
    spec:
      containers:
        - name: probe
          image: docker.io/library/python:3.13-alpine
          command: ["python", "-m", "http.server", "8080", "--directory", "/www"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 2
          volumeMounts:
            - name: page
              mountPath: /www
              readOnly: true
      volumes:
        - name: page
          configMap:
            name: probe-page
---
apiVersion: v1
kind: Service
metadata:
  name: probe
  namespace: starfleet
spec:
  selector:
    app: probe
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ambassador-code
  namespace: starfleet
data:
  proxy.py: |
    import os
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    UPSTREAM_FILE = os.environ.get("UPSTREAM_FILE", "/etc/ambassador/upstream.txt")


    class Handler(BaseHTTPRequestHandler):
        def reply(self, code, body):
            self.send_response(code)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/healthz":
                self.reply(200, b"ok\n")
                return
            try:
                with open(UPSTREAM_FILE) as handle:
                    upstream = handle.read().strip()
                with urllib.request.urlopen(upstream + self.path, timeout=3) as response:
                    self.reply(response.status, response.read())
            except Exception as error:
                self.reply(502, ("bad gateway: %s\n" % error).encode())

        def log_message(self, *args):
            pass


    ThreadingHTTPServer(("127.0.0.1", 9000), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-scout
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: legacy-scout
  template:
    metadata:
      labels:
        app: legacy-scout
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: legacy
          image: docker.io/library/busybox:1.37.0
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                echo "time=$(date +%s)" >> /report/report.txt
                if reply="$(wget -q -T 2 -O - http://127.0.0.1:9000/ 2>/dev/null)"; then
                  echo "status=ok" >> /report/report.txt
                  echo "reply=$reply" >> /report/report.txt
                  echo "legacy: uplink ok"
                else
                  echo "status=error" >> /report/report.txt
                  echo "legacy: uplink failed"
                fi
                sleep 5
              done
          volumeMounts:
            - name: report
              mountPath: /report
      volumes:
        - name: report
          emptyDir: {}
