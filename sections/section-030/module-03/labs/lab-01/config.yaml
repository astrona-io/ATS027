# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Convert A Log Shipper Into A Native Sidecar (LAB). Graded against the live cluster.
# UNTESTED: written statically, never run.
apiVersion: astrona.io/v1
metadata:
  name: ats-027-lab-030-03-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
      - docker.io/library/busybox:1.37.0

# Starting state: the Job nightly-report, whose ordinary log-shipper container
# never exits, so the Job never completes.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the Job with the never-ending log-shipper container
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Replace the Job with the native sidecar version
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: job-completes
      description: The Job nightly-report completes with one success and no failure
      type: file
      source: validation/validate-job-completes.sh
      hint: A Job completes when its Pod succeeds, and a Pod succeeds only when every container has ended. Look at which container keeps running.
    - name: shipper-is-native-sidecar
      description: log-shipper is an init container with restartPolicy Always
      type: file
      source: validation/validate-shipper-is-native-sidecar.sh
      hint: Move log-shipper from containers to initContainers and add restartPolicy Always to it.
    - name: report-unchanged-no-deadline
      description: report is the only application container and the Job has no deadline
      type: file
      source: validation/validate-report-container-unchanged.sh
      hint: Keep the report container as it is and do not use activeDeadlineSeconds.
    - name: shipper-shipped-lines
      description: log-shipper printed the readings before it stopped
      type: file
      source: validation/validate-shipper-shipped-lines.sh
      hint: The sidecar must start before report and keep following /logs/report.log until the kubelet stops it.
    - name: pod-succeeded
      description: The Pod of the Job is in the phase Succeeded
      type: file
      source: validation/validate-pod-succeeded.sh
      hint: The kubelet stops a native sidecar after the application containers end, and then the Pod is Succeeded.

teardown:
  keepCluster: false
