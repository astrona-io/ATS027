# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Native Sidecar Containers And Pod Lifecycle (PLAYGROUND). A clean sandbox with no task and no grading.
# UNTESTED: written statically, never run.
apiVersion: astrona.io/v1
metadata:
  name: ats-027-playground-030-03
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
      - docker.io/library/busybox:1.37.0
      - docker.io/library/python:3.13-alpine

bootstrap:
  manifests:
    - name: starfleet
      type: file
      source: manifests/starfleet.yaml
  waitFor:
    - resource: deploy/probe
      namespace: starfleet
    - resource: pod/shuttle
      namespace: starfleet
    - resource: pod/drifter
      namespace: outpost

teardown:
  keepCluster: false
