# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Persistent And Ephemeral Volumes Capstone (LAB) - UNTESTED, written statically.
# Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-027-lab-040-capstone
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
      - docker.io/library/busybox:1.37.0

# Starting state: probe with a wrong claim, wrong mounts and a subPath settings file.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the ConfigMap, the faulty claim and the probe Deployment
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: claim-spec
      description: probe-data is Bound, ReadWriteOnce, at least 1Gi
      type: file
      source: validation/validate-claim.sh
      hint: Access modes and the storage class of a claim cannot be edited. Scale the consumer down, delete the claim and create it again.
    - name: mount-paths
      description: The claim is at /var/lib/probe and an emptyDir is at /scratch
      type: file
      source: validation/validate-mount-paths.sh
      hint: Read the JOURNAL_DIR and SCRATCH_DIR environment variables of the container and mount each volume at the matching path.
    - name: projected-config
      description: /etc/probe is a read-only projected volume without subPath
      type: file
      source: validation/validate-config-projected.sh
      hint: Use one projected volume with the probe.conf key from probe-settings and the Pod labels. Remove the subPath mount.
    - name: journal-on-claim
      description: The journal is written to the claim and scratch data to the emptyDir
      type: file
      source: validation/validate-journal-on-claim.sh
      hint: Wait until the new Pod is Running, then read /var/lib/probe/journal and list /scratch.
    - name: replacement-behaviour
      description: The journal survives Pod replacement and scratch data does not
      type: file
      source: validation/validate-replacement-behaviour.sh
      hint: The journal must live on the claim. The scratch file of the old Pod must be gone in the new Pod.

teardown:
  keepCluster: false
