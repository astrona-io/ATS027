# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# ConfigMap, Secret, Projected And Downward API Volumes (PLAYGROUND) - UNTESTED, written statically, never run.
# A clean sandbox: a Deployment that mounts a ConfigMap and a Secret
# as volumes. No task, no grading.
apiVersion: astrona.io/v1
metadata:
  name: ats-027-playground-040-04
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
      - docker.io/library/busybox:1.37.0

bootstrap:
  manifests:
    - name: fixtures
      type: file
      source: manifests/fixtures.yaml
  waitFor:
    - resource: deploy/scout
      namespace: starfleet
    - resource: deploy/drifter
      namespace: outpost

teardown:
  keepCluster: false
