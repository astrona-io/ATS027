apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scout-settings
  namespace: starfleet
data:
  app.properties: |
    mode=survey
    interval=30
  log-level: info
---
apiVersion: v1
kind: Secret
metadata:
  name: scout-credentials
  namespace: starfleet
type: Opaque
stringData:
  api-key: starfleet-key-001
  signing-key: starfleet-sign-001
---
# scout reads the same ConfigMap four ways: as a volume, through one subPath
# file, through an environment variable. The Secret is a volume with a
# restrictive default mode.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
        tier: edge
    spec:
      containers:
        - name: app
          image: docker.io/library/busybox:1.37.0
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            limits:
              memory: 128Mi
          env:
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: scout-settings
                  key: log-level
          volumeMounts:
            - name: settings
              mountPath: /etc/scout/settings
            - name: settings
              mountPath: /etc/scout/pinned.properties
              subPath: app.properties
            - name: credentials
              mountPath: /etc/scout/credentials
              readOnly: true
      volumes:
        - name: settings
          configMap:
            name: scout-settings
        - name: credentials
          secret:
            secretName: scout-credentials
            defaultMode: 0400
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drifter
  namespace: outpost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: drifter
  template:
    metadata:
      labels:
        app: drifter
    spec:
      containers:
        - name: app
          image: docker.io/library/busybox:1.37.0
          command: ["sh", "-c", "while true; do sleep 3600; done"]
