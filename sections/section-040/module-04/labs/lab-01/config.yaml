# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Deliver Configuration Through One Projected Volume (LAB) - UNTESTED, written statically.
# Graded against the live cluster.
apiVersion: astrona.io/v1
metadata:
  name: ats-027-lab-040-04-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
      - docker.io/library/busybox:1.37.0

# Starting state: scout with only a plain ConfigMap volume.
bootstrap:
  init:
    - name: seed-cluster
      description: Create the ConfigMap, the Secret and the scout Deployment
      type: file
      source: bootstrap/01-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: projected-sources
      description: One projected volume merges the ConfigMap, the Secret and the downward API
      type: file
      source: validation/validate-projected-sources.sh
      hint: Use one projected volume named bundle with a configMap, a secret and a downwardAPI source.
    - name: no-standalone-volumes
      description: No separate ConfigMap or Secret volume, bundle is read-only at /etc/scout
      type: file
      source: validation/validate-no-standalone-volumes.sh
      hint: Remove the old settings volume and mount bundle at /etc/scout with readOnly true.
    - name: file-modes
      description: The settings file is 0444 and the key file is 0400
      type: file
      source: validation/validate-file-modes.sh
      hint: Set mode on each item. Write octal values with a leading zero, for example 0400.
    - name: downward-files
      description: The labels file and the memory limit file are correct
      type: file
      source: validation/validate-downward-files.sh
      hint: Use fieldRef metadata.labels and resourceFieldRef limits.memory with containerName app and divisor 1Mi.
    - name: app-reads-config
      description: The running app logs config-complete
      type: file
      source: validation/validate-app-reads-config.sh
      hint: The app needs four files at fixed paths under /etc/scout. Check the item paths.

teardown:
  keepCluster: false
