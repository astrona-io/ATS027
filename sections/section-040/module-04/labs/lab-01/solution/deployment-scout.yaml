apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
        tier: edge
    spec:
      containers:
        - name: app
          image: docker.io/library/busybox:1.37.0
          command:
            - sh
            - -c
            - |
              while true; do
                if [ -s /etc/scout/settings/app.properties ] && [ -s /etc/scout/secret/api-key ] && [ -s /etc/scout/meta/labels ] && [ -s /etc/scout/meta/memory-limit ]; then
                  echo "config-complete memory=$(cat /etc/scout/meta/memory-limit)Mi"
                else
                  echo "config-missing"
                fi
                sleep 5
              done
          resources:
            limits:
              memory: 128Mi
          volumeMounts:
            - name: bundle
              mountPath: /etc/scout
              readOnly: true
      volumes:
        - name: bundle
          projected:
            defaultMode: 0440
            sources:
              - configMap:
                  name: scout-settings
                  items:
                    - key: app.properties
                      path: settings/app.properties
                      mode: 0444
              - secret:
                  name: scout-credentials
                  items:
                    - key: api-key
                      path: secret/api-key
                      mode: 0400
              - downwardAPI:
                  items:
                    - path: meta/labels
                      fieldRef:
                        fieldPath: metadata.labels
                    - path: meta/memory-limit
                      resourceFieldRef:
                        containerName: app
                        resource: limits.memory
                        divisor: 1Mi
