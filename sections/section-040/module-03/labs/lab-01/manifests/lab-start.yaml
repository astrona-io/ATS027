apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
# shuttle starts with no volumes. The container writes its markers into the
# container writable layer, which every restart discards.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      containers:
        - name: app
          image: docker.io/library/busybox:1.37.0
          command:
            - sh
            - -c
            - |
              mkdir -p /cache /work
              [ -f /cache/created ] || echo "$HOSTNAME" > /cache/created
              echo started >> /cache/starts
              [ -f /work/owner ] || echo "$HOSTNAME" > /work/owner
              trap 'exit 1' TERM
              while true; do sleep 1; done
