apiVersion: astrona.io/v1
metadata:
  name: ats-027-playground-010-03
  docs:
    guide: docs/overview.md
runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.0@sha256:452d707d4862f52530247495d180205e029056831160e22870e37e3f6c1ac31f
    preloadImages:
    - docker.io/library/python:3.13-alpine
    - docker.io/library/busybox:1.37.0
bootstrap:
  manifests:
  - name: environment
    type: file
    source: manifests/environment.yaml
  waitFor:
  - resource: pod/shuttle
    namespace: starfleet
  - resource: pod/drifter
    namespace: outpost
teardown:
  keepCluster: false
