status: draft
provenance: Original practice material; not official examination questions.
scope:
  type: section
  id: section-010
  title: Define, build and modify container images
placement:
  position: after
  reading: sections/section-010/module-02/course-02-summary.md
questions:
- id: ats027-section-010-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Explain image layers and immutable digests.
  source_readings:
  - sections/section-010/module-01/course-01-layers-tags-and-digests.md
  prompt: Which reference identifies exact image content rather than a mutable label?
  options:
  - id: a
    text: A short tag such as latest
    explanation: A mutable tag can point to different content over time.
  - id: b
    text: The Deployment name
    explanation: A workload name does not identify the image bytes it runs.
  - id: c
    text: An image digest
    explanation: A digest identifies particular content and is useful when exact artifact identity matters.
  correct_option: c
  explanation: A digest identifies particular content and is useful when exact artifact identity matters.
- id: ats027-section-010-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Diagnose image selection and pull failures.
  source_readings:
  - sections/section-010/module-01/course-02-from-build-to-image-pull.md
  prompt: An image exists on the author's laptop but a node cannot retrieve it. What should be examined
    first?
  options:
  - id: a
    text: The readiness response path
    explanation: Readiness is relevant after the process can start.
  - id: b
    text: The node's image reference and registry access
    explanation: Node preparation needs an available image and appropriate registry access.
  - id: c
    text: The Service's host routing rule
    explanation: Service routing does not retrieve container images.
  correct_option: b
  explanation: Node preparation needs an available image and appropriate registry access.
- id: ats027-section-010-q03
  type: single_choice
  difficulty: beginner
  learning_objective: Interpret build context and Dockerfile instructions.
  source_readings:
  - sections/section-010/module-02/course-01-building-an-image-with-a-clear-runtime-contract.md
  prompt: COPY cannot find a required source file during a build. Which relationship is most relevant?
  options:
  - id: a
    text: The file's location and inclusion in the build context
    explanation: COPY uses inputs available to the builder through the build context.
  - id: b
    text: The running Pod's namespace
    explanation: Pod namespace does not supply missing build context files.
  - id: c
    text: The Service's selector
    explanation: Backend selection does not determine build inputs.
  correct_option: a
  explanation: COPY uses inputs available to the builder through the build context.
- id: ats027-section-010-q04
  type: single_choice
  difficulty: beginner
  learning_objective: Distinguish build-time actions from container startup.
  source_readings:
  - sections/section-010/module-02/course-01-building-an-image-with-a-clear-runtime-contract.md
  prompt: A Dockerfile RUN instruction starts a web process. What does this establish for later containers?
  options:
  - id: a
    text: The process will run automatically in every Pod
    explanation: Runtime startup comes from the effective command and arguments.
  - id: b
    text: The application is publicly reachable
    explanation: Build actions do not create Kubernetes access infrastructure.
  - id: c
    text: Only a build-time action, not a persistent runtime server
    explanation: RUN executes during image creation and does not preserve a running process into later
      containers.
  correct_option: c
  explanation: RUN executes during image creation and does not preserve a running process into later containers.
- id: ats027-section-010-q05
  type: single_choice
  difficulty: beginner
  learning_objective: Explain multi-stage runtime dependencies.
  source_readings:
  - sections/section-010/module-02/course-01-building-an-image-with-a-clear-runtime-contract.md
  prompt: A smaller runtime stage lacks a shared library required by the compiled program. What is the
    appropriate correction?
  options:
  - id: a
    text: Increase the desired replica count
    explanation: More copies of the same incompatible image repeat the failure.
  - id: b
    text: Provide compatible runtime dependencies or a compatible executable
    explanation: The final image must satisfy the program's runtime contract.
  - id: c
    text: Add a Service port declaration
    explanation: A Service does not supply missing executable libraries.
  correct_option: b
  explanation: The final image must satisfy the program's runtime contract.
