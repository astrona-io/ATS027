apiVersion: batch/v1
kind: CronJob
metadata:
  name: scheduled-report
  namespace: starfleet
spec:
  schedule: '*/5 * * * *'
  concurrencyPolicy: Forbid
  suspend: true
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: report
            image: docker.io/library/busybox:1.37.0
            command:
            - sh
            - -c
            - printf 'scheduled-report\n'
