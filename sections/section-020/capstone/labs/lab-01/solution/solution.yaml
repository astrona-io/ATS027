apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: starfleet
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      containers:
      - name: agent
        image: docker.io/library/busybox:1.37.0
        command: ["sh", "-c", "sleep 36000"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scout-web
  namespace: starfleet
spec:
  replicas: 3
  selector:
    matchLabels:
      app: scout-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: scout-web
    spec:
      containers:
      - name: web
        image: docker.io/library/busybox:1.37.0
        command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && httpd -f -p 8080 -h /www"]
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /index.html
            port: 8080
          periodSeconds: 2
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: outpost-sweep
  namespace: starfleet
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: sweep
            image: docker.io/library/busybox:1.37.0
            command: ["sh", "-c", "echo sweep done"]
---
apiVersion: v1
kind: Service
metadata:
  name: ledger
  namespace: starfleet
spec:
  clusterIP: None
  selector:
    app: ledger
  ports:
  - name: tcp
    port: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledger
  namespace: starfleet
spec:
  serviceName: ledger
  replicas: 2
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
    spec:
      containers:
      - name: ledger
        image: docker.io/library/busybox:1.37.0
        command: ["sh", "-c", "sleep 36000"]
        volumeMounts:
        - name: data
          mountPath: /data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 100Mi
