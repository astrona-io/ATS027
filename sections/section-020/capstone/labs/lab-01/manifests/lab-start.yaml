apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-agent
  namespace: starfleet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent
    spec:
      containers:
      - name: agent
        image: docker.io/library/busybox:1.37.0
        command: ["sh", "-c", "sleep 36000"]
---
apiVersion: v1
kind: Pod
metadata:
  name: scout-web
  namespace: starfleet
  labels:
    app: scout-web
spec:
  containers:
  - name: web
    image: docker.io/library/busybox:1.37.0
    command: ["sh", "-c", "mkdir -p /www && echo ok > /www/index.html && httpd -f -p 8080 -h /www"]
    ports:
    - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outpost-sweep
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outpost-sweep
  template:
    metadata:
      labels:
        app: outpost-sweep
    spec:
      containers:
      - name: sweep
        image: docker.io/library/busybox:1.37.0
        command: ["sh", "-c", "while true; do echo sweep done; sleep 900; done"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: starfleet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledger
  template:
    metadata:
      labels:
        app: ledger
    spec:
      containers:
      - name: ledger
        image: docker.io/library/busybox:1.37.0
        command: ["sh", "-c", "sleep 36000"]
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
