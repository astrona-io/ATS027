apiVersion: batch/v1
kind: Job
metadata:
  name: probe-scan
  namespace: starfleet
spec:
  completions: 3
  parallelism: 2
  completionMode: Indexed
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: scan
        image: docker.io/library/busybox:1.37.0
        command: ["sh", "-c", "echo scanned slice $JOB_COMPLETION_INDEX"]
